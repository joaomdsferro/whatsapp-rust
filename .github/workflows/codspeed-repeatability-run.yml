name: CodSpeed repeatability experiment

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: never
  PROTOC_VERSION: "3.25.3"
  MALLOC_ARENA_MAX: "1"
  MALLOC_MMAP_THRESHOLD_: "131072"
  MALLOC_TRIM_THRESHOLD_: "131072"
  MALLOC_TOP_PAD_: "131072"

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          # Match the normal workflow's immutable merge commit for this event.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-16
      - name: Key libc debug cache
        id: libc6
        run: cargo xt ci workflow libc-version
      - uses: actions/cache@v6
        with:
          path: ~/.cache/libc6-dbg
          key: libc6-dbg-${{ runner.arch }}-${{ steps.libc6.outputs.version }}
      - name: Install libc debug symbols
        env:
          LIBC6_VERSION: ${{ steps.libc6.outputs.version }}
        run: cargo xt ci workflow install-libc-debug
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc@${{ env.PROTOC_VERSION }},cargo-codspeed@5.0.1
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: Linux-cargo-codspeed-repeatability
          cache-targets: "false"
      - name: Build diagnostic targets
        # Match the normal proto-signal shard's dependency feature unification.
        run: >
          cargo codspeed build -m simulation -m memory -m walltime
          -p wacore-binary -p wacore-libsignal -p wacore-appstate
          -p whatsapp-rust-sqlite-storage
      - name: Record fixed source and toolchain
        run: |
          git rev-parse HEAD
          sha256sum Cargo.lock wacore/libsignal/benches/*.rs wacore/libsignal/benches/support/session_fixture.rs
          find target/codspeed -maxdepth 3 -type f -executable -exec sha256sum {} +
          rustc -Vv
          ldd --version
          lscpu
      - name: Measure original, batch, and isolated fixtures
        uses: CodSpeedHQ/action@v5
        with:
          runner-version: 5.4.0
          mode: simulation,walltime
          run: |
            cargo codspeed run -p wacore-libsignal --bench libsignal_benchmark 'bench_session_with_self|bench_session_root_key_update'
            cargo codspeed run -p wacore-libsignal --bench session_identity_isolated
            cargo codspeed run -p wacore-libsignal --bench session_root_key_isolated
