name: Fixed-revision original session walltime

on:
  workflow_call:
    inputs:
      source-revision:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: never
  PROTOC_VERSION: "3.25.3"
  MALLOC_ARENA_MAX: "1"
  MALLOC_MMAP_THRESHOLD_: "131072"
  MALLOC_TRIM_THRESHOLD_: "131072"
  MALLOC_TOP_PAD_: "131072"

jobs:
  diagnostic:
    # Only the two reviewed same-repository revisions may execute with OIDC.
    if: >-
      github.repository == 'oxidezap/whatsapp-rust' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (inputs.source-revision == 'f1080df166bbc2c88e762eda6eb5bb7f6efc2f05' ||
       inputs.source-revision == 'c42dd44c59acff7825eae7d09e940a08c71d91a2')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          repository: oxidezap/whatsapp-rust
          ref: ${{ inputs.source-revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-16
      - name: Key libc debug cache
        id: libc6
        run: cargo xt ci workflow libc-version
      - uses: actions/cache@v6
        with:
          path: ~/.cache/libc6-dbg
          key: libc6-dbg-${{ runner.arch }}-${{ steps.libc6.outputs.version }}
      - name: Install libc debug symbols
        env:
          LIBC6_VERSION: ${{ steps.libc6.outputs.version }}
        run: cargo xt ci workflow install-libc-debug
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc@${{ env.PROTOC_VERSION }},cargo-codspeed@5.0.1
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: Linux-cargo-codspeed-repeatability
          cache-targets: "false"
      - name: Build diagnostic targets
        # Match the normal proto-signal shard's dependency feature unification.
        run: >
          cargo codspeed build -m walltime
          -p wacore-binary -p wacore-libsignal -p wacore-appstate
          -p whatsapp-rust-sqlite-storage
      - name: Record fixed source and toolchain
        run: |
          git rev-parse HEAD
          sha256sum Cargo.lock wacore/libsignal/benches/libsignal_benchmark.rs
          find target/codspeed -maxdepth 3 -type f -executable -exec sha256sum {} +
          rustc -Vv
          ldd --version
          lscpu
      # CodSpeed's run is attached to this diagnostic PR. The recorded checkout
      # above, not that PR's head label, identifies the source being measured.
      - name: Measure only original self and non-self session cases
        uses: CodSpeedHQ/action@v5
        with:
          runner-version: 5.4.0
          mode: walltime
          run: cargo codspeed run -p wacore-libsignal --bench libsignal_benchmark 'bench_session_with_self'
