name: R03 original session walltime head 2

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read
  id-token: write

jobs:
  diagnostic:
    if: >-
      github.head_ref == 'bench/session-repeatability' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.label.name == 'r03-walltime-fixed-revisions'
    uses: ./.github/workflows/codspeed-repeatability-run.yml
    with:
      source-revision: c42dd44c59acff7825eae7d09e940a08c71d91a2
