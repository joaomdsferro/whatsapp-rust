name: R03 original session walltime base 2

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read
  id-token: write

jobs:
  diagnostic:
    if: >-
      github.head_ref == 'bench/session-repeatability' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.label.name == 'r03-walltime-fixed-revisions'
    uses: ./.github/workflows/codspeed-repeatability-run.yml
    with:
      source-revision: f1080df166bbc2c88e762eda6eb5bb7f6efc2f05
